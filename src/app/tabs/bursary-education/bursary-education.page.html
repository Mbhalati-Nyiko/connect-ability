<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Bursary & Education</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Bursary & Education</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="tertiary-information-container">
    <div class="tertiary-information-card">
      <div class="tertiary-information-title-card">
        <h2 class="tertiary-information-title">Tertiary Information</h2>
      </div>
      <div class="tertiary-information-card-options">
        <div class="university-card">
          <p>University</p>
        </div>
        <div class="college-card">
          <p>College</p>
        </div>
      </div>
    </div>
  </div>

  <div class="bursary-information-container">
    <div class="bursary-information-card">
      <div class="bursary-information-title-card">
        <h2 class="bursary-information-title">Bursary Information</h2>
      </div>
      <div class="bursary-information-card-options">
        <div class="university-card">
          <p>University</p>
        </div>
        <div class="college-card">
          <p>College</p>
        </div>
      </div>
    </div>
  </div>
</ion-content>
